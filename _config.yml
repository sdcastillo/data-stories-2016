# SamWiki theme contract
# Theme setup follows GitHub's Jekyll theme guide:
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
#
# Strategy: one supported theme, jekyll-theme-cayman, skinned in assets/css/style.scss.
# This repository publishes from the default branch (gh-pages) at the repository root.
# Live URL: https://sdcastillo.github.io/data-stories-2016/

title: Telling Stories with Data
description: PUBHLTH 490ST, Spring 2016 at UMass Amherst. Regression, visualization, and data stories in R.
theme: jekyll-theme-cayman
show_downloads: false
markdown: kramdown
highlighter: rouge

url: "https://sdcastillo.github.io"
baseurl: "/data-stories-2016"
repository: sdcastillo/data-stories-2016

author:
  name: Nicholas Reich
  email: nick@umass.edu

# Lecture, lab, and quiz HTML files are already complete documents.
# Keep them static so the Cayman layout does not wrap the demos.
optional_front_matter:
  enabled: false

defaults:
  - scope:
      path: ""
    values:
      samwiki: true

exclude:
  - README.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - .bundle
